<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意图识别模块测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .card-title {
            font-size: 1.3rem;
            color: #333;
            font-weight: 600;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #1e3c72;
        }
        .response-area {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .response-area.success {
            border-color: #28a745;
            background: #d4edda;
        }
        .response-area.error {
            border-color: #dc3545;
            background: #f8d7da;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
        .api-endpoint {
            background: #1e3c72;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin-right: 5px;
        }
        .method-GET { background: #17a2b8; }
        .method-POST { background: #28a745; }
        .method-DELETE { background: #dc3545; }
        
        .intent-result {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #1e3c72;
        }
        
        .result-card h4 {
            color: #1e3c72;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            font-weight: 500;
            color: #555;
        }
        
        .result-value {
            color: #333;
            max-width: 200px;
            text-align: right;
            word-break: break-all;
        }
        
        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e, #38ef7d);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .subtask-item {
            background: white;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        
        .subtask-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .subtask-name {
            font-weight: 600;
            color: #1e3c72;
        }
        
        .priority-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .priority-high { background: #f8d7da; color: #721c24; }
        .priority-medium { background: #fff3cd; color: #856404; }
        .priority-low { background: #d4edda; color: #155724; }
        
        .llm-status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .llm-status-card .result-item {
            border-bottom-color: rgba(255,255,255,0.2);
        }
        
        .llm-status-card .result-label,
        .llm-status-card .result-value {
            color: white;
        }
        
        .llm-status-card h4 {
            color: white;
        }
        
        .llm-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .llm-badge-yes {
            background: #11998e;
            color: white;
        }
        
        .llm-badge-no {
            background: #6c757d;
            color: white;
        }
        
        .llm-badge-rule {
            background: #ffc107;
            color: #333;
        }
        
        .llm-badge-llm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            margin-left: 8px;
        }
        
        .subtask-desc {
            color: #666;
            font-size: 13px;
        }
        
        .subtask-deps {
            margin-top: 8px;
            font-size: 12px;
            color: #888;
        }
        
        .quick-examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .example-tag {
            padding: 6px 12px;
            background: #e9ecef;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        
        .example-tag:hover {
            background: #1e3c72;
            color: white;
            transform: translateY(-2px);
        }
        
        .intent-types-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .intent-type-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #1e3c72;
        }
        
        .intent-type-value {
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 5px;
            font-family: monospace;
        }
        
        .intent-type-desc {
            font-size: 13px;
            color: #666;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
        
        .loading {
            color: #1e3c72;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 意图识别模块测试</h1>
        
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span>服务状态</span>
                    <span id="status-badge" class="status-badge status-offline">离线</span>
                </div>
                <button class="btn btn-primary" onclick="checkStatus()">检查状态</button>
            </div>
            <div class="response-area" id="status-response">点击按钮检查服务状态...</div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="api-endpoint method-GET">GET</span>
                    支持的意图类型
                </div>
                <button class="btn btn-primary" onclick="loadIntentTypes()">加载类型</button>
            </div>
            <div id="intent-types-container">
                <div class="response-area loading">点击按钮加载支持的意图类型...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="api-endpoint method-POST">POST</span>
                    单条意图分析
                </div>
            </div>
            
            <div class="quick-examples">
                <span class="example-tag" onclick="setInput('你好，很高兴认识你')">问候</span>
                <span class="example-tag" onclick="setInput('帮我写一个Python的快速排序函数')">代码生成</span>
                <span class="example-tag" onclick="setInput('分析一下上个月的销售数据趋势')">数据分析</span>
                <span class="example-tag" onclick="setInput('如何制定一个有效的项目计划')">任务规划</span>
                <span class="example-tag" onclick="setInput('搜索最新的人工智能发展趋势')">信息搜索</span>
                <span class="example-tag" onclick="setInput('帮我写一封商务邀请邮件')">创意写作</span>
                <span class="example-tag" onclick="setInput('什么是Transformer模型的工作原理')">知识查询</span>
                <span class="example-tag" onclick="setInput('今天天气怎么样')">通用聊天</span>
                <span class="example-tag" onclick="setInput('再见，感谢帮助')">告别</span>
            </div>
            
            <div class="form-group">
                <label for="single-input">输入文本</label>
                <textarea id="single-input" placeholder="请输入要分析意图的文本..."></textarea>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-success" onclick="analyzeSingle()">分析意图</button>
                <button class="btn btn-danger" onclick="clearSingle()">清空</button>
            </div>
            
            <div id="single-result">
                <div class="intent-result" style="display: none;"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="api-endpoint method-POST">POST</span>
                    批量意图分析
                </div>
            </div>
            
            <div class="form-group">
                <label for="batch-input">输入多条文本（每行一条）</label>
                <textarea id="batch-input" placeholder="请输入多条文本，每行一条...
例如：
你好
帮我写一个Python函数
分析销售数据"></textarea>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-success" onclick="analyzeBatch()">批量分析</button>
                <button class="btn btn-danger" onclick="clearBatch()">清空</button>
            </div>
            
            <div id="batch-result">
                <div class="response-area" style="display: none;"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="api-endpoint method-GET">GET</span>
                    分析历史记录
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="loadHistory()">加载历史</button>
                    <button class="btn btn-danger" onclick="clearHistory()">清空历史</button>
                </div>
            </div>
            <div id="history-container">
                <div class="response-area loading">点击按钮加载历史记录...</div>
            </div>
        </div>
    </div>

    <script src="../config/web-config.js"></script>
    <script>
        const BASE_URL = window.AppConfig.api.pythonBaseUrl;

        function setResponse(elementId, content, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.textContent = content;
            element.className = `response-area ${isSuccess ? 'success' : 'error'}`;
            element.style.display = 'block';
        }

        function setInput(text) {
            document.getElementById('single-input').value = text;
        }

        function clearSingle() {
            document.getElementById('single-input').value = '';
            document.getElementById('single-result').innerHTML = '<div class="intent-result" style="display: none;"></div>';
        }

        function clearBatch() {
            document.getElementById('batch-input').value = '';
            document.getElementById('batch-result').innerHTML = '<div class="response-area" style="display: none;"></div>';
        }

        async function checkStatus() {
            try {
                document.getElementById('status-response').textContent = '正在检查...';
                document.getElementById('status-response').className = 'response-area loading';
                
                const response = await fetch(`${BASE_URL}/intent/types`);
                const data = await response.json();
                
                if (data.success) {
                    setResponse('status-response', '服务连接正常！\n\n支持的意图类型数量: ' + data.intent_types.length);
                    document.getElementById('status-badge').className = 'status-badge status-online';
                    document.getElementById('status-badge').textContent = '在线';
                } else {
                    setResponse('status-response', '服务返回错误: ' + data.error, false);
                }
            } catch (error) {
                setResponse('status-response', '服务不可用: ' + error.message, false);
                document.getElementById('status-badge').className = 'status-badge status-offline';
                document.getElementById('status-badge').textContent = '离线';
            }
        }

        async function loadIntentTypes() {
            try {
                const container = document.getElementById('intent-types-container');
                container.innerHTML = '<div class="response-area loading">加载中...</div>';
                
                const response = await fetch(`${BASE_URL}/intent/types`);
                const data = await response.json();
                
                if (data.success) {
                    let html = '<div class="intent-types-grid">';
                    data.intent_types.forEach(type => {
                        html += `
                            <div class="intent-type-card">
                                <div class="intent-type-value">${type.value}</div>
                                <div class="intent-type-desc">${type.description}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<div class="response-area error">加载失败: ${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('intent-types-container').innerHTML = 
                    `<div class="response-area error">请求失败: ${error.message}</div>`;
            }
        }

        function renderIntentResult(result, index = 0) {
            let entitiesHtml = '';
            if (result.entities && Object.keys(result.entities).length > 0) {
                entitiesHtml = '<div class="result-card"><h4>📦 提取的实体</h4>';
                for (const [key, value] of Object.entries(result.entities)) {
                    const displayValue = Array.isArray(value) ? value.join(', ') : JSON.stringify(value);
                    entitiesHtml += `
                        <div class="result-item">
                            <span class="result-label">${key}</span>
                            <span class="result-value">${displayValue}</span>
                        </div>
                    `;
                }
                entitiesHtml += '</div>';
            }

            let subtasksHtml = '';
            if (result.subtasks && result.subtasks.length > 0) {
                subtasksHtml = '<div class="result-card"><h4>📋 拆解的子任务</h4>';
                result.subtasks.forEach((subtask, idx) => {
                    const priorityClass = `priority-${subtask.priority || 'normal'}`;
                    const depsHtml = subtask.dependencies && subtask.dependencies.length > 0 
                        ? `<div class="subtask-deps">依赖: ${subtask.dependencies.join(' → ')}</div>` 
                        : '';
                    
                    subtasksHtml += `
                        <div class="subtask-item">
                            <div class="subtask-header">
                                <span class="subtask-name">${idx + 1}. ${subtask.name}</span>
                                <span class="priority-badge ${priorityClass}">${subtask.priority || 'normal'}</span>
                            </div>
                            <div class="subtask-desc">${subtask.description}</div>
                            ${depsHtml}
                        </div>
                    `;
                });
                subtasksHtml += '</div>';
            }

            const confidencePercent = Math.round(result.confidence * 100);
            const confidenceColor = confidencePercent >= 80 ? '#11998e' : 
                                    confidencePercent >= 50 ? '#ffc107' : '#dc3545';

            const llmDetails = result.llm_details || {};
            const llmUsed = result.llm_used || false;
            const llmAvailable = llmDetails.llm_available || false;
            const llmCalled = llmDetails.llm_called || false;
            const selectedSource = llmDetails.selected_source || 'rule';
            
            let llmHtml = '<div class="result-card llm-status-card">';
            llmHtml += '<h4>🤖 大模型 API 调用状态</h4>';
            
            const llmBadge = llmUsed 
                ? '<span class="llm-badge llm-badge-yes">已调用</span>' 
                : '<span class="llm-badge llm-badge-no">未调用</span>';
            
            const sourceBadge = selectedSource === 'llm' 
                ? '<span class="llm-badge llm-badge-llm">LLM 结果</span>' 
                : '<span class="llm-badge llm-badge-rule">规则匹配</span>';
            
            const availableBadge = llmAvailable 
                ? '<span class="llm-badge llm-badge-yes">可用</span>' 
                : '<span class="llm-badge llm-badge-no">未配置</span>';
            
            const calledBadge = llmCalled 
                ? '<span class="llm-badge llm-badge-yes">已执行</span>' 
                : '<span class="llm-badge llm-badge-no">未执行</span>';
            
            llmHtml += `
                <div class="result-item">
                    <span class="result-label">LLM 可用状态</span>
                    <span class="result-value">${availableBadge}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">本次是否调用 LLM</span>
                    <span class="result-value">${llmBadge}</span>
                </div>
            `;
            
            if (llmAvailable) {
                llmHtml += `
                    <div class="result-item">
                        <span class="result-label">LLM 实际调用</span>
                        <span class="result-value">${calledBadge}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">最终结果来源</span>
                        <span class="result-value">${sourceBadge}</span>
                    </div>
                `;
                
                if (llmCalled && llmDetails.rule_intent) {
                    const ruleConf = Math.round((llmDetails.rule_confidence || 0) * 100);
                    const llmConf = Math.round((llmDetails.llm_confidence || 0) * 100);
                    
                    llmHtml += `
                        <div class="result-item">
                            <span class="result-label">规则匹配</span>
                            <span class="result-value">${llmDetails.rule_intent} (${ruleConf}%)</span>
                        </div>
                    `;
                    
                    if (llmDetails.llm_intent) {
                        llmHtml += `
                            <div class="result-item">
                                <span class="result-label">LLM 识别</span>
                                <span class="result-value">${llmDetails.llm_intent} (${llmConf}%)</span>
                            </div>
                        `;
                    }
                }
            }
            
            llmHtml += '</div>';

            return `
                <div class="result-card">
                    <h4>🎯 基本信息</h4>
                    <div class="result-item">
                        <span class="result-label">原始输入</span>
                        <span class="result-value">${result.original_input}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">意图类型</span>
                        <span class="result-value"><strong>${result.intent}</strong></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">置信度</span>
                        <span class="result-value">${confidencePercent}%</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${confidencePercent}%; background: ${confidenceColor};"></div>
                    </div>
                    <div class="result-item">
                        <span class="result-label">判断理由</span>
                        <span class="result-value">${result.reason}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">分析时间</span>
                        <span class="result-value">${new Date(result.analyzed_at).toLocaleString('zh-CN')}</span>
                    </div>
                </div>
                ${llmHtml}
                ${entitiesHtml}
                ${subtasksHtml}
            `;
        }

        async function analyzeSingle() {
            const text = document.getElementById('single-input').value.trim();
            if (!text) {
                alert('请输入要分析的文本');
                return;
            }

            const resultContainer = document.getElementById('single-result');
            resultContainer.innerHTML = '<div class="response-area loading">正在分析...</div>';

            try {
                const response = await fetch(`${BASE_URL}/intent/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();

                if (data.success) {
                    const html = `<div class="intent-result">${renderIntentResult(data.result)}</div>`;
                    resultContainer.innerHTML = html;
                } else {
                    resultContainer.innerHTML = `<div class="response-area error">分析失败: ${data.error}</div>`;
                }
            } catch (error) {
                resultContainer.innerHTML = `<div class="response-area error">请求失败: ${error.message}</div>`;
            }
        }

        async function analyzeBatch() {
            const inputText = document.getElementById('batch-input').value.trim();
            if (!inputText) {
                alert('请输入要分析的文本');
                return;
            }

            const texts = inputText.split('\n').filter(t => t.trim());
            if (texts.length === 0) {
                alert('请至少输入一条文本');
                return;
            }

            const resultContainer = document.getElementById('batch-result');
            resultContainer.innerHTML = '<div class="response-area loading">正在批量分析...</div>';

            try {
                const response = await fetch(`${BASE_URL}/intent/analyze/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texts })
                });
                const data = await response.json();

                if (data.success) {
                    let html = `<h3 style="margin-bottom: 20px;">批量分析结果 (共 ${data.count} 条)</h3>`;
                    data.results.forEach((result, idx) => {
                        html += `
                            <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px dashed #e9ecef;">
                                <h4 style="color: #1e3c72; margin-bottom: 15px;">📌 第 ${idx + 1} 条</h4>
                                <div class="intent-result">
                                    ${renderIntentResult(result, idx)}
                                </div>
                            </div>
                        `;
                    });
                    resultContainer.innerHTML = `<div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">${html}</div>`;
                } else {
                    resultContainer.innerHTML = `<div class="response-area error">分析失败: ${data.error}</div>`;
                }
            } catch (error) {
                resultContainer.innerHTML = `<div class="response-area error">请求失败: ${error.message}</div>`;
            }
        }

        async function loadHistory() {
            try {
                const container = document.getElementById('history-container');
                container.innerHTML = '<div class="response-area loading">加载中...</div>';
                
                const response = await fetch(`${BASE_URL}/intent/history`);
                const data = await response.json();
                
                if (data.success) {
                    if (data.count === 0) {
                        container.innerHTML = '<div class="response-area">暂无历史记录</div>';
                        return;
                    }
                    
                    let html = `<h3 style="margin-bottom: 20px;">历史分析记录 (共 ${data.count} 条)</h3>`;
                    data.history.reverse().forEach((item, idx) => {
                        html += `
                            <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px dashed #e9ecef;">
                                <h4 style="color: #1e3c72; margin-bottom: 15px;">📜 记录 ${data.count - idx}</h4>
                                <div class="intent-result">
                                    ${renderIntentResult(item.result)}
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = `<div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">${html}</div>`;
                } else {
                    container.innerHTML = `<div class="response-area error">加载失败: ${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('history-container').innerHTML = 
                    `<div class="response-area error">请求失败: ${error.message}</div>`;
            }
        }

        async function clearHistory() {
            if (!confirm('确定要清空所有历史记录吗？')) {
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/intent/history`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('history-container').innerHTML = 
                        '<div class="response-area success">历史记录已清空</div>';
                } else {
                    document.getElementById('history-container').innerHTML = 
                        `<div class="response-area error">清空失败: ${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('history-container').innerHTML = 
                    `<div class="response-area error">请求失败: ${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            loadIntentTypes();
        });
    </script>
</body>
</html>
