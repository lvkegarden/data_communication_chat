name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        default: 'debug'
        required: true
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_CMDLINE_TOOLS: '11076708'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List directory structure
        run: |
          echo "=== 项目根目录 ==="
          ls -la
          echo "=== android/android 目录 ==="
          ls -la android/android/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          cmdline-tools: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: >
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Init Gradle Wrapper
        working-directory: android/android
        run: |
          echo "=== 初始化 Gradle Wrapper ==="
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ls -la gradlew

      - name: List android project files
        working-directory: android/android
        run: |
          echo "=== build.gradle (root) ==="
          cat build.gradle
          echo ""
          echo "=== settings.gradle ==="
          cat settings.gradle
          echo ""
          echo "=== app/build.gradle ==="
          cat app/build.gradle
          echo ""
          echo "=== 资源文件 ==="
          find app/src/main -type f | head -50

      - name: Build Debug APK
        if: ${{ github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == '' }}
        working-directory: android/android
        run: |
          echo "=== 开始构建 Debug APK ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          echo "=== 构建完成 ==="

      - name: Build Release APK
        if: ${{ github.event.inputs.release_type == 'release' }}
        working-directory: android/android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== 开始构建 Release APK ==="
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "使用签名密钥..."
            echo "$KEYSTORE_FILE" | base64 -d > keystore.jks
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --stacktrace --no-daemon
          else
            echo "未配置签名密钥"
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          fi
          echo "=== 构建完成 ==="

      - name: Find APK files
        run: |
          echo "=== 查找 APK 文件 ==="
          find . -name "*.apk" -type f

      - name: Upload Debug APK
        if: ${{ github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ github.event.inputs.release_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/app-release*.apk
          retention-days: 30
