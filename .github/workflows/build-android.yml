name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        default: 'debug'
        required: true
        type: choice
        options:
          - debug
          - release
      version_name:
        description: '版本号 (如: 1.0.0)'
        default: '1.0.0'
        required: false

env:
  APP_NAME: 'LocalRest Agent'
  PACKAGE_NAME: 'com.localrest.mobile'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_CMDLINE_TOOLS: '11076708'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List directory structure
        run: |
          echo "=== 项目根目录 ==="
          ls -la
          echo "=== android/android 目录 ==="
          ls -la android/android/ 2>/dev/null || echo "android/android 目录不存在"
          echo "=== android/web 目录 ==="
          ls -la android/web/ 2>/dev/null || echo "android/web 目录不存在"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Verify Java
        run: |
          echo "=== Java 版本 ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo $JAVA_HOME

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          cmdline-tools: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: >
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Copy web files to assets
        run: |
          echo "=== 复制 Web 文件到 Android Assets ==="
          mkdir -p android/android/app/src/main/assets/web
          cp -r android/web/* android/android/app/src/main/assets/web/
          ls -la android/android/app/src/main/assets/web/

      - name: Copy sample data to assets
        run: |
          echo "=== 复制数据文件 ==="
          mkdir -p android/android/app/src/main/assets
          
          if [ -f "data/localrest.db" ]; then
            echo "找到 localrest.db，复制到 assets"
            cp data/localrest.db android/android/app/src/main/assets/
          elif [ -f "android/assets/sampleData.json" ]; then
            echo "找到 sampleData.json，复制到 assets"
            cp android/assets/sampleData.json android/android/app/src/main/assets/
          else
            echo "警告: 未找到数据文件"
          fi
          
          ls -la android/android/app/src/main/assets/

      - name: Make gradlew executable
        working-directory: android/android
        run: |
          echo "=== 检查 gradlew ==="
          ls -la gradlew 2>/dev/null || echo "gradlew 不存在"
          chmod +x gradlew 2>/dev/null || true

      - name: List android project structure
        working-directory: android/android
        run: |
          echo "=== Android 项目结构 ==="
          ls -la
          echo "=== app 目录 ==="
          ls -la app/ 2>/dev/null
          echo "=== app/src 目录 ==="
          ls -la app/src/ 2>/dev/null

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == '' }}
        working-directory: android/android
        run: |
          echo "=== 开始构建 Debug APK ==="
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "=== 构建完成 ==="

      - name: Build APK (Release)
        if: ${{ github.event.inputs.release_type == 'release' }}
        working-directory: android/android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== 开始构建 Release APK ==="
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "使用签名密钥..."
            echo "$KEYSTORE_FILE" | base64 -d > keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --stacktrace --no-daemon
          else
            echo "未配置签名密钥，构建未签名 Release APK"
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi
          echo "=== 构建完成 ==="

      - name: Find APK files
        run: |
          echo "=== 查找 APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload Debug APK
        if: ${{ github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ github.event.inputs.release_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/app-release*.apk
          retention-days: 30

      - name: Upload Mapping File (Release)
        if: ${{ github.event.inputs.release_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: |
            **/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/app-debug.apk
            **/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
