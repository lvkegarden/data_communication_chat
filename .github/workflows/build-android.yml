name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        default: 'debug'
        required: true
        type: choice
        options:
          - debug
          - release
      version_name:
        description: '版本号 (如: 1.0.0)'
        default: '1.0.0'
        required: false

env:
  APP_NAME: 'LocalRest Agent'
  PACKAGE_NAME: 'com.localrest.mobile'
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_CMDLINE_TOOLS: '11076708'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List directory structure
        run: |
          echo "=== 项目根目录 ==="
          ls -la
          echo "=== android 目录 ==="
          ls -la android/ 2>/dev/null || echo "android 目录不存在"
          echo "=== android/web 目录 ==="
          ls -la android/web/ 2>/dev/null || echo "android/web 目录不存在"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify environments
        run: |
          echo "=== Java 版本 ==="
          java -version
          echo "=== Node 版本 ==="
          node --version
          echo "=== npm 版本 ==="
          npm --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          cmdline-tools: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: >
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node.js dependencies
        working-directory: android
        run: |
          echo "=== 检查 package.json ==="
          cat package.json
          echo "=== 安装依赖 ==="
          npm install --legacy-peer-deps

      - name: List node_modules
        working-directory: android
        run: |
          echo "=== node_modules 目录 ==="
          ls -la node_modules/ 2>/dev/null | head -20
          echo "=== 检查 npx 是否可用 ==="
          npx --version

      - name: Initialize Capacitor (if not exists)
        working-directory: android
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo "=== 初始化 Capacitor ==="
            npx cap init "${{ env.APP_NAME }}" "${{ env.PACKAGE_NAME }}" --web-dir=web
          else
            echo "=== capacitor.config.json 已存在 ==="
            cat capacitor.config.json
          fi

      - name: Add Android platform (if not exists)
        working-directory: android
        run: |
          if [ ! -d "android" ]; then
            echo "=== 添加 Android 平台 ==="
            npx cap add android
          else
            echo "=== Android 平台已存在 ==="
            ls -la android/
          fi

      - name: Sync Capacitor
        working-directory: android
        run: |
          echo "=== 同步 Capacitor ==="
          npx cap sync android 2>&1 || npx cap sync

      - name: List Android project
        working-directory: android
        run: |
          echo "=== android/android 目录 ==="
          ls -la android/ 2>/dev/null
          echo "=== 检查 gradlew ==="
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "gradlew 存在并已设置可执行权限"
          else
            echo "警告: gradlew 不存在"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == '' }}
        working-directory: android/android
        run: |
          echo "=== 开始构建 Debug APK ==="
          ./gradlew assembleDebug --stacktrace 2>&1
          echo "=== 构建完成 ==="

      - name: Build APK (Release)
        if: ${{ github.event.inputs.release_type == 'release' }}
        working-directory: android/android
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== 开始构建 Release APK ==="
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "使用签名密钥..."
            echo "$KEYSTORE_FILE" | base64 -d > keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --stacktrace
          else
            echo "未配置签名密钥，构建未签名 Release APK"
            ./gradlew assembleRelease --stacktrace
          fi

      - name: List APK files
        run: |
          echo "=== 查找 APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload Debug APK
        if: ${{ github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ github.event.inputs.release_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/app-release*.apk
          retention-days: 30

      - name: Upload Mapping File (Release)
        if: ${{ github.event.inputs.release_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: |
            **/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/app-debug.apk
            **/app-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
