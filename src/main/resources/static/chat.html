<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header h1 {
            color: white;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .header-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .chat-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: calc(100vh - 120px);
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header-avatar {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .chat-header-text h2 {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
        .chat-header-text span {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .clear-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .chat-message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.user {
            flex-direction: row-reverse;
        }
        .chat-message.user .chat-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
            margin-right: 12px;
        }
        .chat-message.bot .chat-content {
            background: white;
            color: #333;
            border-radius: 18px 18px 18px 4px;
            margin-left: 12px;
            border: 1px solid #e9ecef;
        }
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .chat-message.bot .chat-avatar {
            background: #e9ecef;
        }
        .chat-message.user .chat-avatar {
            background: rgba(102, 126, 234, 0.2);
            color: white;
        }
        .chat-content {
            max-width: 70%;
            padding: 14px 18px;
            line-height: 1.6;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .chat-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }
        .chat-message.user .chat-time {
            text-align: left;
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
        }
        .typing-indicator span {
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .chat-input-area {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-area input:focus {
            border-color: #667eea;
        }
        .send-btn {
            width: 50px;
            height: 50px;
            border: none;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .submit-btn {
            padding: 0 24px;
            height: 50px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .payload-preview {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 15px 20px;
            display: none;
        }
        .payload-preview.show {
            display: block;
        }
        .payload-preview h4 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .payload-preview pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .json-key {
            color: #569cd6;
        }
        .json-string {
            color: #ce9178;
        }
        .json-number {
            color: #b5cea8;
        }
        .json-boolean {
            color: #569cd6;
        }
        .json-null {
            color: #858585;
        }
        .welcome-message {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .welcome-message h3 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 10px;
        }
        .welcome-message p {
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI 智能对话助手</h1>
        <a href="/" class="header-link">← 返回首页</a>
    </div>

    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-avatar">🤖</div>
                    <div class="chat-header-text">
                        <h2>通义千问</h2>
                        <span>基于阿里云大模型</span>
                    </div>
                </div>
                <button class="clear-btn" onclick="clearChat()">清空对话</button>
            </div>

            <div class="chat-history" id="chat-history">
                <div class="welcome-message">
                    <h3>👋 你好！有什么可以帮助你的吗？</h3>
                    <p>我可以回答问题、编写代码、写作创意、翻译语言等各种任务。</p>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="输入消息..." onkeypress="handleChatKeypress(event)">
                <button class="send-btn" id="send-btn" onclick="prepareChat()">预览</button>
                <button class="submit-btn" id="submit-btn" onclick="submitChat()" disabled>提交</button>
            </div>
            <div class="payload-preview" id="payload-preview">
                <h4>📤 准备发送的报文：</h4>
                <pre id="payload-content"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let chatSessionId = 'web-' + Date.now();
        let pendingMessage = null;
        let pendingPayload = null;

        function addChatMessage(content, isUser = false) {
            const history = document.getElementById('chat-history');
            const welcome = history.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${isUser ? 'user' : 'bot'}`;
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            messageDiv.innerHTML = `
                <div class="chat-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="chat-content">
                    ${escapeHtml(content)}
                    <div class="chat-time">${time}</div>
                </div>
            `;
            history.appendChild(messageDiv);
            history.scrollTop = history.scrollHeight;
        }

        function addTypingIndicator() {
            const history = document.getElementById('chat-history');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'chat-message bot';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="chat-avatar">🤖</div>
                <div class="chat-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            history.appendChild(typingDiv);
            history.scrollTop = history.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setInputEnabled(enabled) {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            input.disabled = !enabled;
            sendBtn.disabled = !enabled;
        }

        function setSubmitEnabled(enabled) {
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = !enabled;
        }

        function highlightJson(jsonString) {
            if (!jsonString) return '<span style="color: #858585;">null</span>';
            
            let result = jsonString
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            
            result = result.replace(
                /"([^"]+)":/g,
                '<span class="json-key">"$1"</span>:'
            );
            
            result = result.replace(
                /: "([^"]+)"/g,
                ': <span class="json-string">"$1"</span>'
            );
            
            result = result.replace(
                /: (\d+\.?\d*)/g,
                ': <span class="json-number">$1</span>'
            );
            
            result = result.replace(
                /: (true|false)/g,
                ': <span class="json-boolean">$1</span>'
            );
            
            result = result.replace(
                /: null/g,
                ': <span class="json-null">null</span>'
            );
            
            return result;
        }

        function formatJsonPreview(data) {
            if (!data) return '';
            
            try {
                if (typeof data === 'string') {
                    try {
                        const parsed = JSON.parse(data);
                        return JSON.stringify(parsed, null, 2);
                    } catch {
                        return data;
                    }
                }
                return JSON.stringify(data, null, 2);
            } catch {
                return typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            }
        }

        function showPayloadPreview(payloadData) {
            const preview = document.getElementById('payload-preview');
            const content = document.getElementById('payload-content');
            
            if (!payloadData) {
                content.innerHTML = '<span style="color: #858585;">预览数据为空</span>';
                preview.classList.add('show');
                return;
            }
            
            const formattedJson = formatJsonPreview(payloadData);
            const highlightedHtml = highlightJson(formattedJson);
            
            content.innerHTML = highlightedHtml;
            preview.classList.add('show');
        }

        function hidePayloadPreview() {
            const preview = document.getElementById('payload-preview');
            preview.classList.remove('show');
        }

        async function prepareChat() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            pendingMessage = message;
            pendingPayload = {
                session_id: chatSessionId,
                message: message,
                flag: 'n'
            };

            setInputEnabled(false);
            
            try {
                const response = await fetch(`${API_BASE}/chat/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingPayload)
                });
                const data = await response.json();

                if (data.success) {
                    addChatMessage(message, true);
                    input.value = '';
                    pendingPayload = {
                        session_id: chatSessionId,
                        message: message,
                        flag: 'y'
                    };
                    showPayloadPreview(data.preview);
                    setSubmitEnabled(true);
                } else {
                    addChatMessage('预览失败: ' + data.error);
                    setSubmitEnabled(false);
                }
            } catch (error) {
                addChatMessage('预览请求失败: ' + error.message);
                setSubmitEnabled(false);
            } finally {
                setInputEnabled(true);
            }
        }

        async function submitChat() {
            if (!pendingMessage || !pendingPayload) return;

            pendingPayload.flag = 'y';
            setSubmitEnabled(false);
            addTypingIndicator();

            try {
                const response = await fetch(`${API_BASE}/chat/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingPayload)
                });
                const data = await response.json();
                removeTypingIndicator();

                if (data.success) {
                    addChatMessage(data.message);
                } else {
                    addChatMessage('抱歉: ' + data.error);
                }
            } catch (error) {
                removeTypingIndicator();
                addChatMessage('请求失败: ' + error.message);
            } finally {
                pendingMessage = null;
                pendingPayload = null;
                hidePayloadPreview();
                setInputEnabled(true);
                document.getElementById('chat-input').focus();
            }
        }

        function handleChatKeypress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                const submitBtn = document.getElementById('submit-btn');
                if (!submitBtn.disabled && pendingMessage) {
                    submitChat();
                } else {
                    prepareChat();
                }
            }
        }

        function clearChat() {
            chatSessionId = 'web-' + Date.now();
            pendingMessage = null;
            pendingPayload = null;
            const history = document.getElementById('chat-history');
            history.innerHTML = `
                <div class="welcome-message">
                    <h3>👋 你好！有什么可以帮助你的吗？</h3>
                    <p>我可以回答问题、编写代码、写作创意、翻译语言等各种任务。</p>
                </div>
            `;
            hidePayloadPreview();
            setSubmitEnabled(false);
            document.getElementById('chat-input').focus();
        }

        document.getElementById('chat-input').focus();
    </script>
</body>
</html>
