server:
  port: 8080

spring:
  application:
    name: local-rest-service

  datasource:
    url: jdbc:sqlite:./data/localrest.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect

langgraph:
  api-url: ${LANGGRAPH_API_URL:http://localhost:5001/api}

logging:
  level:
    com.example.localrestservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG