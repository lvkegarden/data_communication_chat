# ============================================================================
# LLM (大语言模型) 配置文件
# 路径: config/llm.yml
# ============================================================================
# 使用说明:
# 1. 此文件包含所有 LLM 模型相关的配置参数
# 2. 部分敏感配置（如 API Key）通过环境变量覆盖，不要在此文件中存储真实密钥
# 3. 修改此文件后需要重启 Python 服务才能生效
# ============================================================================

llm:
  default_provider: "qwen"
  temperature: 0.7
  max_tokens: null
  top_p: null

providers:
  qwen:
    model: "qwen-plus"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    
  deepseek:
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
