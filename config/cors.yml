# ============================================================================
# CORS (跨域资源共享) 配置文件
# 路径: config/cors.yml
# ============================================================================
# 使用说明:
# 1. 此文件包含 CORS 相关的配置参数
# 2. 用于配置允许的来源、方法、头部等
# 3. 修改此文件后需要重启 Spring Boot 服务才能生效
# ============================================================================

cors:
  allowed_origins:
    - "*"
  
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  
  allowed_headers:
    - "*"
  
  max_age: 3600
  
  allow_credentials: false
